<title id="title">Illustrative scenario: required weekly activity versus assumed capture</title>
<desc id="desc">At fixed price, fee rate and destruction allocation, raising assumed fee capture from 25 to 50 to 100 percent lowers required eligible activity from 49.47 to 24.74 to 12.37 billion US dollars per week. The target is dated epoch rewards, not total issuance or investment break-even.</desc>
