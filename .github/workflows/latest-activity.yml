name: Latest activity manual refresh

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REFRESH to authorise one capped extraction
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: latest-activity-publication
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.LATEST_REFRESH_ENABLED == 'true' && inputs.confirmation == 'REFRESH' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: latest-activity
    permissions:
      contents: write
      id-token: write
    env:
      LATEST_REFRESH_ENABLED: 'true'
      LATEST_BILLING_PROJECT: ${{ vars.LATEST_BILLING_PROJECT }}
      LATEST_MAX_BYTES_BILLED: ${{ vars.LATEST_MAX_BYTES_BILLED || '5368709120' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-refresh.txt
      - run: python -m pip install -r requirements.txt -r requirements-refresh.txt
      - run: python -m unittest discover -s tests -v
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.LATEST_WIF_PROVIDER }}
          service_account: ${{ vars.LATEST_SERVICE_ACCOUNT }}
          project_id: ${{ vars.LATEST_BILLING_PROJECT }}
          create_credentials_file: true
      - id: extract
        run: python -m latest_activity.refresh
      - name: Publish validated data or failure status
        if: always() && steps.extract.outcome != 'skipped' && steps.extract.outcome != ''
        run: |
          git add -- latest_activity_data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh latest activity'
          git push origin HEAD:main
